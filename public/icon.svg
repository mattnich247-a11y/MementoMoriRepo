<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a0808" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#140606" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#050505" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="40%" stop-color="#e61919"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#000000"/>
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- Subtle corner / border luxury accent frame -->
  <rect x="20" y="20" width="472" height="472" rx="48" fill="none" stroke="#261010" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- "MM" Logo Mark in Serif style matching the user's design -->
  <!-- Memento Mori initials MM -->
  <g id="letters-mm" transform="translate(0, -10)">
    <!-- Ambient glow behind MM -->
    <text x="256" y="270" text-anchor="middle" font-family="'Times New Roman', 'Nimbus Roman', 'Liberation Serif', 'Georgia', serif" font-weight="900" font-size="205" fill="#dc2626" opacity="0.35" filter="url(#crimsonGlow)" letter-spacing="4">MM</text>
    
    <!-- Primary sharp MM -->
    <text x="256" y="270" text-anchor="middle" font-family="'Times New Roman', 'Nimbus Roman', 'Liberation Serif', 'Georgia', serif" font-weight="900" font-size="205" fill="url(#redGrad)" letter-spacing="4">MM</text>
  </g>

  <!-- "Time Tracker" in golden serif script / uppercase spaced font -->
  <g id="sub-title" transform="translate(0, 0)">
    <text x="256" y="348" text-anchor="middle" font-family="'Times New Roman', 'Nimbus Roman', 'Liberation Serif', 'Georgia', serif" font-weight="600" font-size="33" fill="url(#goldGrad)" letter-spacing="3.5">Time Tracker</text>
  </g>

  <!-- Tiny golden decorative balance dots -->
  <circle cx="118" cy="340" r="2" fill="#f59e0b" opacity="0.6"/>
  <circle cx="394" cy="340" r="2" fill="#f59e0b" opacity="0.6"/>
</svg>